<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>CARperception · 失败案例浏览</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>CARperception <span>/ 失败案例</span></strong><div id="status" role="status">正在初始化…</div></header>
<main><aside><div class="filters"><h1>失败事件工作台</h1><small id="overview"></small>
<label>浏览层级<select id="view"><option value="events">目标事件</option><option value="groups">问题分组排行榜</option><option value="cases">原始逐帧案例</option></select></label>
<div id="groupScope" hidden><span id="groupLabel"></span><button id="clearGroup">退出分组筛选</button></div><p>score ≥0.25 · 中心距离 &lt;2m<br>固定阈值诊断，与官方 AP 评估分开</p><div class="grid"><label>评估分支<select id="module"><option value="">全部分支</option><option value="detection">检测</option><option value="tracking">跟踪</option></select></label><label>失败类型<select id="kind"><option value="">全部类型</option></select></label></div><div class="grid"><label>目标类别<select id="className"><option value="">全部类别</option></select></label><label>复核状态<select id="reviewFilter"><option value="">全部状态</option></select></label></div><label>人工标签<select id="labelFilter"><option value="">全部人工标签</option></select></label><label>目标距离（米）<select id="distance"><option value="">全部距离</option><option value="0:10">0 ≤ 距离 &lt; 10 m</option><option value="10:20">10 ≤ 距离 &lt; 20 m</option><option value="20:40">20 ≤ 距离 &lt; 40 m</option><option value="40:Infinity">距离 ≥ 40 m</option></select></label><label>预测置信度<select id="confidence"><option value="">全部置信度（含 FN）</option><option value="0.25:0.4">[0.25, 0.40)</option><option value="0.4:0.6">[0.40, 0.60)</option><option value="0.6:0.8">[0.60, 0.80)</option><option value="0.8:1">[0.80, 1.00]</option><option value="na">无置信度（FN）</option></select></label><small>同一条记录同时符合距离和置信度才保留；筛选列表，不重评指标。回放仅显示选中案例的异常框。ID 使用当帧新 ID 的预测分数。</small><label>搜索案例、帧号或 ID<input id="query" placeholder="例如 case_01217" autocomplete="off"></label><div class="nav"><button id="prev" disabled>← 上一条</button><button id="next" disabled>下一条 →</button></div><small id="count"></small><button id="exportLabels">导出人工修正记录</button><button id="exportReviews">导出复核快照</button></div><div id="list" aria-label="失败案例列表"></div><section id="detail"><h2>案例详情</h2><p>选择左侧案例后，所有视图跳到对应帧。可先筛选，等待记录加载完成。</p></section></aside><section id="workspace"><div id="displayControls"><label><input type="checkbox" id="showNormal" disabled> 显示正常目标（按需加载）</label><span id="displayStatus" data-mode="errors">仅加载选中异常框 · 保留图像、点云和车道线背景</span></div><div id="selection">尚未选择案例</div><div id="viewer"></div></section></main><script type="module" src="/app.js"></script></body></html>
